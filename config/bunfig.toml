# Prefer Bun to run scripts (bun run uses the Bun runtime, not Node).
[run]
bun = true

# Isolated installs — strict, symlinked node_modules (like pnpm), no phantom deps.
[install]
linker = "isolated"

# Only re-print failing tests on reruns.
[test]
onlyFailures = true

# Built-in formatter (`bun fmt`). Option names follow Prettier.
[fmt]
printWidth = 140
singleQuote = true
ignorePatterns = ["**/.claude", "**/build", "**/*.gen.ts", "**/mockServiceWorker.js"]

# Sort within blank-line-separated chunks; never insert blank lines between groups.
[fmt.sortImports]
newlinesBetween = false
partitionByNewline = true
